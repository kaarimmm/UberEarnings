<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UberControl</title>
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UberControl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #020617; -webkit-text-size-adjust: 100%; }
body { background: #020617; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding-bottom: calc(3rem + env(safe-area-inset-bottom)); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
header { background: #0f172a; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 50; padding: calc(1rem + env(safe-area-inset-top)) 1rem 1rem; display: flex; justify-content: space-between; align-items: center; }
main { max-width: 28rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
section { display: flex; flex-direction: column; gap: .75rem; }
h1 { font-size: 1.25rem; font-weight: 700; color: #34d399; }
h2 { font-size: .875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #cbd5e1; }
label { display: block; font-size: .75rem; font-weight: 500; color: #94a3b8; margin-bottom: .25rem; }
input { display: block; width: 100%; min-width: 0; min-height: 2.75rem; background: #020617; border: 1px solid #1e293b; border-radius: .75rem; padding: .625rem .75rem; color: #f1f5f9; font-size: 1rem; outline: none; color-scheme: dark; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input:focus { border-color: var(--col, #10b981); }
button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; touch-action: manipulation; }

.badge { font-size: .75rem; background: #1e293b; color: #cbd5e1; padding: .25rem .625rem; border-radius: 9999px; }
.card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1rem; padding: 1.25rem; }
.mini { padding: .75rem; }
.grid { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: .75rem; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.peq { font-size: .75rem; color: #94a3b8; }
.monto { font-size: 1rem; font-weight: 700; margin-top: .25rem; }
.btn { width: 100%; background: var(--col, #10b981); color: #020617; font-weight: 700; padding: .75rem; border-radius: .75rem; transition: transform .1s; }
.btn:active { transform: scale(.95); }
.link { font-size: .75rem; color: #34d399; text-decoration: underline; }

.tabs { display: grid; grid-template-columns: var(--cols, 1fr 1fr auto); background: #020617; border: 1px solid #1e293b; border-radius: .75rem; padding: .25rem; font-size: .875rem; font-weight: 600; }
.tabs button { color: #64748b; padding: .5rem; border-radius: .5rem; }
#tabs { margin-bottom: 1rem; }
#tabs button:last-child { padding: .5rem 1rem; }
#filtros { --cols: repeat(4, 1fr); font-size: .75rem; }
.tabs .on { background: #1e293b; color: #f1f5f9; }

.periodo { display: flex; background: #0f172a; border: 1px solid #1e293b; border-radius: 9999px; padding: .125rem; font-size: .75rem; font-weight: 500; }
.periodo button { color: #94a3b8; padding: .25rem .75rem; border-radius: 9999px; }
.periodo .on { background: #10b981; color: #020617; }

.item { background: #0f172a; border: 1px solid #1e293b; padding: 1rem; border-radius: .75rem; display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
.item.edit { border-color: var(--col); }
.nota { font-size: .75rem; color: #64748b; margin-top: .25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vacio { text-align: center; padding: 2rem; color: #64748b; font-size: .875rem; background: rgba(15,23,42,.5); border: 1px solid rgba(30,41,59,.6); border-radius: 1rem; }
</style>
</head>
<body>

<header>
    <h1>🚗 UberControl</h1>
    <span class="badge">v1.0</span>
</header>

<main>
    <section>
        <div class="row" style="padding: 0 .25rem">
            <h2>Resumen</h2>
            <div class="periodo">
                <button data-p="mes">Este mes</button>
                <button data-p="todo">Todo</button>
            </div>
        </div>
        <div class="card" style="border-color: rgba(6,78,59,.6)">
            <p class="peq" style="text-transform: uppercase; letter-spacing: .05em">Ganancia neta</p>
            <p id="neto" style="font-size: 2.25rem; font-weight: 900; margin-top: .25rem">$0</p>
            <p id="detalle" class="peq" style="color: #64748b; margin-top: .25rem"></p>
        </div>
        <div id="resumen" class="grid" style="--n: 3"></div>
    </section>

    <div class="card">
        <div id="tabs" class="tabs">
            <button data-t="ganancia">🚗 Jornada</button>
            <button data-t="combustible">⛽ Combustible</button>
            <button data-t="otros" title="Otros gastos">⋮</button>
        </div>
        <form id="form" style="display: flex; flex-direction: column; gap: 1rem">
            <div class="grid">
                <div><label>Fecha</label><input type="date" id="fecha" required></div>
                <div><label>Monto ($)</label><input type="number" step="any" inputmode="decimal" id="monto" placeholder="0" required></div>
            </div>
            <div><label>Notas (opcional)</label><input type="text" id="notas"></div>
            <button class="btn" id="guardar"></button>
            <button type="button" id="cancelar" hidden style="font-size: .875rem; color: #94a3b8; padding: .25rem">Cancelar edición</button>
        </form>
    </div>

    <section>
        <div class="row" style="padding: 0 .25rem">
            <h2>Historial</h2>
            <div class="row">
                <button class="link" onclick="$('archivo').click()">Importar CSV</button>
                <button class="link" onclick="exportarCSV()">Exportar CSV</button>
            </div>
        </div>
        <div id="filtros" class="tabs"></div>
        <div id="lista" style="display: flex; flex-direction: column; gap: .625rem"></div>
        <p class="peq" style="text-align: center; color: #475569">Tocá un registro para corregirlo</p>
    </section>
    <input type="file" id="archivo" hidden>
</main>

<script>
const $ = id => document.getElementById(id);
const T = {
    ganancia:    { ic: '🚗', col: '#34d399', nom: 'Ganancias',   res: 'Bruto',       sub: 'Jornada',              ph: 'Ej: Zona centro, lluvia...' },
    combustible: { ic: '⛽', col: '#fb7185', nom: 'Combustible', res: 'Combustible', sub: 'Carga de combustible', ph: 'Ej: Tanque lleno, GNC...' },
    otros:       { ic: '🧾', col: '#fbbf24', nom: 'Otros',       res: 'Otros',       sub: 'Otro gasto',           ph: '¿En qué? Peaje, lavado, comida...' }
};

const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } };
const escapar = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const formato = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 });
const plata = n => `${n < 0 ? '-' : ''}$${formato.format(Math.abs(n))}`;
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const fechaCorta = iso => {
    const [a, m, d] = iso.split('-').map(Number);
    return `${DIAS[new Date(a, m - 1, d).getDay()]} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}${a !== new Date().getFullYear() ? '/' + String(a).slice(2) : ''}`;
};
const enPeriodo = f => periodo === 'todo' || f.startsWith(hoy().slice(0, 7));

let sec = 0;
const nid = () => Date.now() * 1000 + (sec++ % 1000);
const guardar = () => localStorage.setItem('uber_datos', JSON.stringify(datos));

let periodo = localStorage.getItem('uber_periodo') || 'mes', filtro = 'todo', tipo = 'ganancia', editando = null;

// Un solo listado: {id, tipo, fecha, monto, notas}. Si hay datos de la versión anterior, se convierten una vez
// (los datos viejos no se borran).
let datos = leer('uber_datos', null);
if (!datos) {
    datos = [];
    leer('uber_registros_android', []).forEach(r => {
        const add = (t, monto, notas = '') => monto > 0 && datos.push({ id: nid(), tipo: t, fecha: r.fecha, monto, notas });
        add('ganancia', Number(r.ingresos || 0) + Number(r.propinas || 0), r.notas || '');
        add('combustible', Number(r.combustible || 0));
        add('otros', Number(r.otrosGastos || 0));
    });
    leer('uber_cargas_combustible', []).forEach(c => datos.push({ id: nid(), tipo: 'combustible', fecha: c.fecha, monto: Number(c.monto), notas: c.notas || '' }));
    guardar();
}

function actualizar() {
    document.querySelectorAll('.periodo button').forEach(b => b.classList.toggle('on', b.dataset.p === periodo));

    const items = datos.filter(d => enPeriodo(d.fecha)).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);
    const tot = { ganancia: 0, combustible: 0, otros: 0 };
    items.forEach(i => tot[i.tipo] += i.monto);
    const neto = tot.ganancia - tot.combustible - tot.otros;
    const jornadas = items.filter(i => i.tipo === 'ganancia').length;

    $('neto').textContent = plata(neto);
    $('neto').style.color = neto >= 0 ? T.ganancia.col : T.combustible.col;
    $('detalle').textContent = `en ${jornadas} ${jornadas === 1 ? 'jornada' : 'jornadas'}`;
    $('resumen').innerHTML = Object.keys(T).map(k => `
        <div class="card mini"><p class="peq">${T[k].res}</p>
        <p class="monto" style="color: ${T[k].col}">${plata(k === 'ganancia' ? tot[k] : -tot[k])}</p></div>`).join('');

    $('filtros').innerHTML = ['todo', ...Object.keys(T)].map(k =>
        `<button data-f="${k}" class="${k === filtro ? 'on' : ''}">${k === 'todo' ? 'Todo' : T[k].nom}</button>`).join('');

    const ver = items.filter(i => filtro === 'todo' || i.tipo === filtro);
    $('lista').innerHTML = ver.length ? ver.map(i => {
        const t = T[i.tipo], gan = i.tipo === 'ganancia';
        return `<div class="item${i.id === editando ? ' edit' : ''}" style="--col: ${t.col}">
            <div style="min-width: 0; flex: 1" onclick="editar(${i.id})">
                <b>${t.ic} ${fechaCorta(i.fecha)}</b>
                <p class="nota">${t.sub}${i.notas ? ' · ' + escapar(i.notas) : ''}</p>
            </div>
            <div class="row" style="flex-shrink: 0">
                <b style="font-size: 1.125rem; color: ${t.col}" onclick="editar(${i.id})">${gan ? '+' : ''}${plata(gan ? i.monto : -i.monto)}</b>
                <button onclick="eliminar(${i.id})" style="color: #475569; padding: .25rem">✕</button>
            </div>
        </div>`;
    }).join('') : `<p class="vacio">${periodo === 'mes' ? 'Nada cargado este mes todavía.' : 'No hay registros todavía.'}</p>`;
}

function setTipo(t) {
    tipo = t;
    $('form').style.setProperty('--col', T[t].col);
    $('notas').placeholder = T[t].ph;
    $('guardar').textContent = editando ? 'Guardar cambios' : 'Guardar ' + T[t].sub.toLowerCase();
    $('cancelar').hidden = !editando;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}

function editar(id) {
    const d = datos.find(x => x.id === id);
    if (!d) return;
    editando = id;
    setTipo(d.tipo);
    $('fecha').value = d.fecha;
    $('monto').value = d.monto;
    $('notas').value = d.notas;
    actualizar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function terminarEdicion() {
    editando = null;
    $('monto').value = $('notas').value = '';
    $('fecha').value = hoy();
    setTipo(tipo);
    actualizar();
}

function eliminar(id) {
    if (!confirm('¿Eliminar este registro?')) return;
    datos = datos.filter(d => d.id !== id);
    guardar();
    if (id === editando) terminarEdicion(); else actualizar();
}

// ---- CSV ----
const SUB = { 'Jornada': 'ganancia', 'Carga de combustible': 'combustible', 'Otro gasto': 'otros' };
const num = s => parseFloat(String(s || '').replace(',', '.')) || 0;

function partirCSV(linea) {
    const celdas = []; let t = '', comillas = false;
    for (let i = 0; i < linea.length; i++) {
        const c = linea[i];
        if (comillas) {
            if (c === '"') { if (linea[i + 1] === '"') { t += '"'; i++; } else comillas = false; }
            else t += c;
        } else if (c === '"') comillas = true;
        else if (c === ';') { celdas.push(t); t = ''; }
        else t += c;
    }
    celdas.push(t);
    return celdas;
}

// Lee el CSV nuevo (Fecha;Tipo;Monto;Notas) y también el de la versión anterior de la app
// (Fecha;Tipo;Ingresos;Combustible;OtrosGastos;Notas). No duplica lo que ya está cargado.
function importarCSV(texto) {
    const filas = texto.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim()).map(partirCSV);
    if (filas.length < 2) throw new Error('vacío');
    const viejo = (filas[0][2] || '').trim() === 'Ingresos';
    const previos = datos.slice();
    let nuevos = 0, repetidos = 0;
    const sumar = (t, fecha, monto, notas) => {
        if (!(monto > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return;
        if (previos.some(d => d.tipo === t && d.fecha === fecha && d.monto === monto && d.notas === notas)) { repetidos++; return; }
        datos.push({ id: nid(), tipo: t, fecha, monto, notas });
        nuevos++;
    };
    filas.slice(1).forEach(f => {
        const fecha = (f[0] || '').trim();
        if (viejo) {
            const notas = (f[5] || '').trim();
            sumar('ganancia', fecha, num(f[2]), notas);
            sumar('combustible', fecha, num(f[3]), (f[1] || '').trim() === 'Combustible' ? notas : '');
            sumar('otros', fecha, num(f[4]), '');
        } else if (SUB[(f[1] || '').trim()]) {
            sumar(SUB[f[1].trim()], fecha, num(f[2]), (f[3] || '').trim());
        }
    });
    return { nuevos, repetidos };
}

$('archivo').onchange = async e => {
    const archivo = e.target.files[0];
    if (!archivo) return;
    try {
        const r = importarCSV(await archivo.text());
        guardar();
        actualizar();
        alert(`Importados: ${r.nuevos}. Ya estaban: ${r.repetidos}.`);
    } catch (err) {
        alert('No se pudo leer el archivo. Tiene que ser un CSV exportado desde esta app.');
    }
    e.target.value = '';
};

async function exportarCSV() {
    if (!datos.length) return alert('No hay datos.');
    const filas = [...datos].sort((a, b) => b.fecha.localeCompare(a.fecha)).map(d =>
        `${d.fecha};${T[d.tipo].sub};${String(d.monto).replace('.', ',')};"${d.notas.replace(/"/g, '""')}"`);
    const csv = '\uFEFF' + 'Fecha;Tipo;Monto;Notas\n' + filas.join('\n');
    // En iPhone se abre el menú de compartir (Guardar en Archivos, AirDrop, WhatsApp...)
    try {
        const archivo = new File([csv], 'uber_datos.csv', { type: 'text/csv' });
        if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
            await navigator.share({ files: [archivo] });
            return;
        }
    } catch (err) {
        if (err.name === 'AbortError') return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = 'uber_datos.csv';
    a.click();
}

// ---- Eventos ----
$('form').onsubmit = e => {
    e.preventDefault();
    const reg = { tipo, fecha: $('fecha').value, monto: parseFloat($('monto').value) || 0, notas: $('notas').value.trim() };
    const era = editando;
    if (era) Object.assign(datos.find(d => d.id === era), reg);
    else datos.push({ id: nid(), ...reg });
    guardar();
    if (era) terminarEdicion();
    else { $('monto').value = $('notas').value = ''; actualizar(); }
};
$('cancelar').onclick = terminarEdicion;
$('tabs').onclick = e => e.target.dataset.t && setTipo(e.target.dataset.t);
$('filtros').onclick = e => { if (e.target.dataset.f) { filtro = e.target.dataset.f; actualizar(); } };
document.querySelectorAll('.periodo button').forEach(b => b.onclick = () => {
    periodo = b.dataset.p;
    localStorage.setItem('uber_periodo', periodo);
    actualizar();
});

$('fecha').value = hoy();
setTipo('ganancia');
actualizar();

// Pide al sistema que no borre los datos si falta espacio, y deja la app lista para usar sin internet
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
